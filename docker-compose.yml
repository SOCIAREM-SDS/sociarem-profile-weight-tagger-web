name: sociarem-profiles

services:
  web:
    image: nginx:1.27-alpine
    container_name: sociarem-profiles
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Solo los ficheros de la app se publican (no .git, .github ni README)
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./data.js:/usr/share/nginx/html/data.js:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
