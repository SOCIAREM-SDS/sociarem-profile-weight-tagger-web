server {
    listen 80;
    server_name sociarem-profiles.217.160.132.242.nip.io;

    root /usr/share/nginx/html;
    index index.html;

    # Cache estático moderado; el HTML siempre se revalida
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
